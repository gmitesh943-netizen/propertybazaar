{% extends 'base.html' %}

{% block title %}Password Reset Complete - PropertyBazaar{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5 text-center">
                <div class="rounded-circle bg-success bg-opacity-10 d-inline-flex align-items-center justify-content-center mx-auto mb-4" style="width: 80px; height: 80px;">
                    <i class="fas fa-check-circle text-success fs-2"></i>
                </div>
                <h3 class="fw-bold mb-3">Password Reset Successful</h3>
                <p class="text-muted mb-4">Your password has been set. You may go ahead and log in now.</p>
                
                <a href="{% url 'accounts:login' %}" class="btn btn-primary w-100 py-3 fw-bold rounded-pill" style="background-color: #ff6600; border: none;">Log in</a>
            </div>
        </div>
    </div>
</div>
{% endblock %}
