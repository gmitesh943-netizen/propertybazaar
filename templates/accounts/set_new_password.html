{% extends 'base.html' %}

{% block title %}Set New Password - PropertyBazaar{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-primary bg-opacity-10 d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                        <i class="fas fa-lock text-primary fs-3"></i>
                    </div>
                    <h3 class="fw-bold">Set New Password</h3>
                    <p class="text-muted small">Please enter your new password twice to confirm.</p>
                </div>

                <form method="POST" action="{% url 'accounts:set_new_password' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">New Password</label>
                        <input type="password" name="password" class="form-control py-3" placeholder="Enter new password" required minlength="8">
                    </div>
                    <div class="mb-4">
                        <label class="form-label fw-bold small text-muted">Confirm Password</label>
                        <input type="password" name="confirm_password" class="form-control py-3" placeholder="Confirm new password" required minlength="8">
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold rounded-pill" style="background-color: #ff6600; border: none;">Save New Password</button>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
