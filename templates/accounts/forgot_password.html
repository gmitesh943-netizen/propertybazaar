{% extends 'base.html' %}

{% block title %}Forgot Password - PropertyBazaar{% endblock %}

{% block content %}
<div class="container py-5">
    <div class="row justify-content-center">
        <div class="col-md-6 col-lg-5">
            <div class="card border-0 shadow-sm rounded-4 p-4 p-md-5">
                <div class="text-center mb-4">
                    <div class="rounded-circle bg-primary bg-opacity-10 d-inline-flex align-items-center justify-content-center mb-3" style="width: 60px; height: 60px;">
                        <i class="fas fa-key text-primary fs-3"></i>
                    </div>
                    <h3 class="fw-bold">Forgot Password?</h3>
                    <p class="text-muted small">Enter your email address and we'll send you a 6-digit OTP to reset your password.</p>
                </div>

                <form method="POST" action="{% url 'accounts:forgot_password' %}">
                    {% csrf_token %}
                    <div class="mb-3">
                        <label class="form-label fw-bold small text-muted">Email Address</label>
                        <input type="email" name="email" class="form-control py-3" placeholder="Enter your email" required>
                    </div>
                    <button type="submit" class="btn btn-primary w-100 py-3 fw-bold mt-3" style="background-color: #ff6600; border: none;">Send OTP</button>
                </form>

                <div class="text-center mt-4 pt-3 border-top">
                    <p class="text-muted small mb-0">Remember your password? <a href="{% url 'accounts:login' %}" class="text-primary fw-bold text-decoration-none">Back to Login</a></p>
                </div>
            </div>
        </div>
    </div>
</div>
{% endblock %}
