{% extends 'base.html' %}

{% block title %}Delete Post - Blog Management{% endblock %}

{% block content %}
<div class="container my-5 py-5 text-center">
    <div class="row justify-content-center">
        <div class="col-md-6">
            <div class="card border-0 shadow-lg p-5 rounded-4">
                <i class="fas fa-exclamation-triangle fa-4x text-primary mb-4"></i>
                <h1 class="h3 fw-bold mb-3">Delete Blog Post?</h1>
                <p class="text-muted mb-5">Are you sure you want to delete "<strong>{{ object.title }}</strong>"? This action cannot be undone.</p>
                
                <form method="POST">
                    {% csrf_token %}
                    <div class="d-grid gap-2 d-md-flex justify-content-md-center">
                        <a href="{% url 'blog:post_detail' object.slug %}" class="btn btn-light px-5 py-2 rounded-3">Cancel</a>
                        <button type="submit" class="btn btn-primary px-5 py-2 rounded-3">Confirm Delete</button>
                    </div>
                </form>
            </div>
        </div>
    </div>
</div>
{% endblock %}
