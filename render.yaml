# Render Blueprint — GitHub repo connect pachi auto deploy
# https://render.com/docs/blueprint-spec

services:
  - type: web
    name: propertybazaar
    runtime: python
    plan: free
    buildCommand: pip install -r requirements.txt && python manage.py collectstatic --noinput && python manage.py migrate --noinput
    startCommand: gunicorn config.wsgi:application --bind 0.0.0.0:$PORT --workers 1 --timeout 120 --preload
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.8
      - key: DEBUG
        value: "False"
      - key: SECRET_KEY
        generateValue: true
      - key: ALLOWED_HOSTS
        value: propertybazaar.onrender.com,.onrender.com
      - key: WEB_CONCURRENCY
        value: "1"
      # Neon.tech thi free Postgres URL copy kari ne Render dashboard ma add karo:
      # - key: DATABASE_URL
      #   sync: false
